plugins { id 'com.android.application' }

android {
    namespace 'com.kulanoglu.borsaradar'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kulanoglu.borsaradar'
        minSdk 26
        targetSdk 35
        versionCode 19
        versionName '0.9.10'
    }

    signingConfigs {
        stableDebug {
            storeFile file(System.getenv('BORSA_RADAR_KEYSTORE'))
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.stableDebug }
    }
}
