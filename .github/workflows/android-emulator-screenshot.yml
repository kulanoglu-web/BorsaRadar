name: Android Emulator Screenshot
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore signing key
        run: base64 -d .ci/borsaradar-final.keystore.b64 > .ci/borsaradar-final.keystore
      - name: Build debug APK
        run: |
          gradle --no-daemon assembleDebug --console=plain
          APK=$(find "$GITHUB_WORKSPACE/app/build/outputs" -type f -name "*.apk" | head -1)
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/BorsaRadar-emulator.apk"
          ls -lh "$GITHUB_WORKSPACE/BorsaRadar-emulator.apk"
      - name: Boot emulator, install and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p emulator-artifacts
            APK="$GITHUB_WORKSPACE/BorsaRadar-emulator.apk"
            echo "APK=$APK"
            test -f "$APK"
            adb install -r "$APK"
            adb shell monkey -p com.kulanoglu.borsaradar.finalapp -c android.intent.category.LAUNCHER 1
            sleep 8
            adb exec-out screencap -p > emulator-artifacts/home.png
            adb shell dumpsys window windows > emulator-artifacts/window.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BorsaRadar-emulator-screenshots
          path: emulator-artifacts/
