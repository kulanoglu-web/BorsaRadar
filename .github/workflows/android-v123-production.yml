name: Build BorsaRadar v153 Production APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Prepare current production source
        run: |
          # Main branch already contains the consolidated UI/radar/chart fixes.
          # Re-applying historical mutation patches creates duplicate Java blocks.
          python3 .ci/patch_v47_release_build.py

      - name: Verify consolidated production source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/java/com/kulanoglu/borsaradar/ReferenceUiActivity.java').read_text(encoding='utf-8')
          checks={
            'manual radar':'TARAMAYI BAŞLAT' in s and 'loadRadarRows()' in s,
            'market radar cache':'saveRadarCache(' in s and 'loadRadarCache(' in s,
            'live spot':'latestSpot(' in s,
            'technical indicators':'loadTechnicalIndicators()' in s and 'BRTV' in s and 'BRM' in s and 'BRH' in s,
            'dynamic target risk':'loadTargetRisk()' in s,
            'financial snapshot':'loadFinancialSnapshot()' in s,
            'live home':'loadFeaturedHome()' in s and 'loadHomeMarketSummary()' in s,
            'chart timeframes':'"1G","1H","1A","3A","6A","1Y","2Y"' in s,
          }
          for k,v in checks.items(): print(k,v)
          if not all(checks.values()): raise SystemExit('Production source verification FAILED')
          PY

      - name: Restore signing key
        run: base64 -d .ci/borsaradar-final.keystore.b64 > .ci/borsaradar-final.keystore
      - name: Build signed release APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon clean assembleRelease --stacktrace --console=plain 2>&1 | tee build-diagnostic.log
          echo ${PIPESTATUS[0]} > build-exit-code.txt
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BorsaRadar-build-diagnostic
          path: build-diagnostic.log
          retention-days: 3
      - name: Enforce build result
        run: |
          code=$(cat build-exit-code.txt)
          test "$code" = "0"
      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk BorsaRadar-v3.12.153.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BorsaRadar-v3.12.153-APK
          path: BorsaRadar-v3.12.153.apk
          if-no-files-found: error
          retention-days: 30

