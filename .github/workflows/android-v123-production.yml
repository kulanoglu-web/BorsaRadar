name: Build BorsaRadar v153 Production APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Prepare current production source
        run: |
          # Main branch already contains the consolidated UI/radar/chart fixes.
          # Re-applying historical mutation patches creates duplicate Java blocks.
          python3 .ci/patch_v47_release_build.py

      - name: Verify consolidated production source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/java/com/kulanoglu/borsaradar/MainActivity.java').read_text(encoding='utf-8')
          d=Path('app/src/main/java/com/kulanoglu/borsaradar/DetailedChartController.java').read_text(encoding='utf-8')
          t=Path('app/src/main/java/com/kulanoglu/borsaradar/ChartTimeframes.java').read_text(encoding='utf-8')
          checks={
            'radar manual scan':'Tüm BIST' in s and 'scanRadar()' in s,
            'radar cache':'saveRadarCache()' in s and 'loadRadarCache()' in s,
            'portfolio persistence':'savePortfolio()' in s and 'loadPortfolio()' in s,
            'unified detail':'renderStockDetail(' in s and 'detailTimeframe' in s,
            'live spot':'latestSpot(symbol)' in s,
            'adjacent navigation':'adjacentSymbol(' in s,
            'chart controller':'DetailedChartController.fetch' in s and 'fetchSeries' in d,
            'timeframes':'2 yıl' in t and '5 dk' in t,
          }
          for k,v in checks.items(): print(k,v)
          if not all(checks.values()): raise SystemExit('Production source verification FAILED')
          PY

      - name: Restore signing key
        run: base64 -d .ci/borsaradar-final.keystore.b64 > .ci/borsaradar-final.keystore
      - name: Build signed release APK
        run: gradle --no-daemon clean assembleRelease --stacktrace --console=plain
      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk BorsaRadar-v3.12.153.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BorsaRadar-v3.12.153-APK
          path: BorsaRadar-v3.12.153.apk
          if-no-files-found: error
          retention-days: 30

