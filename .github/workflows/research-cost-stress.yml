name: BorsaRadar Cost Stress
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/research-cost-stress.yml'
      - 'research/cost_stress.py'
permissions:
  contents: read
jobs:
  coststress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run transaction cost stress
        run: PYTHONPATH=research python3 research/cost_stress.py
      - name: Show result
        run: cat research/result_cost_stress.md
      - uses: actions/upload-artifact@v4
        with:
          name: borsaradar-cost-stress
          path: |
            research/result_cost_stress.md
            research/result_cost_stress.json
          if-no-files-found: error
          retention-days: 30
