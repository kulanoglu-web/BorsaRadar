name: BorsaRadar v30 Structural Bull RS
on:
  push:
    paths: ['research/v30_structural_bull_rs.py','.github/workflows/research-v30-structural-bull.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: PYTHONPATH=research python3 research/v30_structural_bull_rs.py
      - run: cat research/result_v30_structural_bull_rs.md
      - uses: actions/upload-artifact@v4
        with:
          name: borsaradar-v30-structural-bull-rs
          path: |
            research/result_v30_structural_bull_rs.md
            research/result_v30_structural_bull_rs.json
          retention-days: 30