name: BorsaRadar Research Backtest
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'research/**'
      - '.github/workflows/research-backtest.yml'
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run BR-Confirm optimization
        run: PYTHONPATH=research python3 research/backtest_confirm.py
      - name: Show result
        run: cat research/result_confirm.md
      - uses: actions/upload-artifact@v4
        with:
          name: borsaradar-confirm-backtest
          path: |
            research/result_confirm.md
            research/result_confirm.json
          if-no-files-found: error
          retention-days: 30
