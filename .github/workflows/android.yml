name: Build BorsaRadar 1.9 Clean APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Rebuild source archive
        run: |
          cat .buildsrc/part00 .buildsrc/part01 .buildsrc/part02 .buildsrc/part03 > BorsaRadar_v1.8_APK_buildready.zip
          unzip -t BorsaRadar_v1.8_APK_buildready.zip
      - name: Extract source
        run: |
          rm -rf build-v19
          mkdir build-v19
          unzip -q BorsaRadar_v1.8_APK_buildready.zip -d build-v19
      - name: Patch for clean install
        working-directory: build-v19/BorsaRadar
        run: |
          sed -i "s/applicationId 'com.kulanoglu.borsaradar'/applicationId 'com.kulanoglu.borsaradar.clean'/" app/build.gradle
          sed -i 's/minSdk 26/minSdk 23/' app/build.gradle
          sed -i 's/versionCode 18/versionCode 19/' app/build.gradle
          sed -i "s/versionName '[^']*'/versionName '1.9.0'/" app/build.gradle
          sed -i 's/android:label="BorsaRadar"/android:label="BorsaRadar 1.9"/' app/src/main/AndroidManifest.xml
          echo '--- app/build.gradle ---'
          cat app/build.gradle
      - name: Build APK
        working-directory: build-v19/BorsaRadar
        run: gradle --no-daemon clean assembleDebug
      - name: Prepare APK
        run: cp build-v19/BorsaRadar/app/build/outputs/apk/debug/app-debug.apk BorsaRadar-v1.9-clean.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BorsaRadar-v1.9-clean-APK
          path: BorsaRadar-v1.9-clean.apk
          if-no-files-found: error
          retention-days: 30
