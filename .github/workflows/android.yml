name: Build BorsaRadar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Rebuild source archive
        run: |
          cat .buildsrc/part00 .buildsrc/part01 .buildsrc/part02 .buildsrc/part03 > BorsaRadar_v1.8_APK_buildready.zip
          unzip -t BorsaRadar_v1.8_APK_buildready.zip
      - name: Extract v1.8 source
        run: |
          rm -rf build-v18
          mkdir build-v18
          unzip -q BorsaRadar_v1.8_APK_buildready.zip -d build-v18
      - name: Build APK
        working-directory: build-v18/BorsaRadar
        run: gradle --no-daemon clean assembleDebug
      - name: Prepare APK
        run: cp build-v18/BorsaRadar/app/build/outputs/apk/debug/app-debug.apk BorsaRadar-v1.8.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BorsaRadar-v1.8-APK
          path: BorsaRadar-v1.8.apk
          if-no-files-found: error
          retention-days: 30
