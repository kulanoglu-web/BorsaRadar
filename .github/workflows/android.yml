name: Build BorsaRadar 2.0 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Rebuild v2.0 source archive
        run: |
          cat .buildsrc_v20/part00.b64 .buildsrc_v20/part01.b64 .buildsrc_v20/part02.b64 .buildsrc_v20/part03.b64 | base64 -d > BorsaRadar_v2.0_source.zip
          unzip -t BorsaRadar_v2.0_source.zip
      - name: Extract v2.0 source
        run: |
          rm -rf build-v20
          mkdir build-v20
          unzip -q BorsaRadar_v2.0_source.zip -d build-v20
      - name: Inject full BIST universe
        run: |
          cp app/src/main/java/com/kulanoglu/borsaradar/BistUniverse.java build-v20/BorsaRadar/app/src/main/java/com/kulanoglu/borsaradar/BistUniverse.java
      - name: Build APK
        working-directory: build-v20/BorsaRadar
        run: gradle --no-daemon clean assembleDebug
      - name: Prepare APK
        run: cp build-v20/BorsaRadar/app/build/outputs/apk/debug/app-debug.apk BorsaRadar-v2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BorsaRadar-v2.0-APK
          path: BorsaRadar-v2.0.apk
          if-no-files-found: error
          retention-days: 30
