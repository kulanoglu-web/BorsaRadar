name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install stable Huawei-compatible debug signature
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          echo '' | base64 --decode > "$HOME/.android/debug.keystore"
          mv "$HOME/.android/debug.keystore" "$GITHUB_WORKSPACE/borsaradar-debug.keystore"
      - name: Build explicitly with permanent signing key
        env:
          BORSA_RADAR_KEYSTORE: ${{ github.workspace }}/borsaradar-debug.keystore
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BorsaRadar-v0.9.9-Permanent-Signature-APK
          path: app/build/outputs/apk/debug/app-debug.apk
