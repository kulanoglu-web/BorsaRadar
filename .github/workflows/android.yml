name: Build BorsaRadar 3.12.9 APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Apply broker and alarm base patch
        run: python3 .ci/patch_v31.py
      - name: Apply lazy timeframe patch
        run: python3 .ci/patch_v37.py
      - name: Apply v3.8.1 V35 and notification tap patch
        run: python3 .ci/patch_v38.py
      - name: Enable Germany and US quote symbols
        run: python3 .ci/patch_v41_market.py
      - name: Add Germany and US direct entry UI
        run: python3 .ci/patch_v41_ui.py
      - name: Fix autocomplete dropdown
        run: python3 .ci/patch_v42_autocomplete_fix.py
      - name: Add full technical and context detail analysis
        run: python3 .ci/patch_v48_full_analysis.py
      - name: Apply robust build compatibility fixes
        run: python3 .ci/patch_v49_buildfix.py
      - name: Enable two-stage radar enrichment
        run: python3 .ci/patch_v50_two_stage_radar.py
      - name: Use preserved multi-engine technical radar score
        run: python3 .ci/patch_v52_multi_technical_radar.py
      - name: Add portfolio risk and action labels
        run: python3 .ci/patch_v51_portfolio_decisions.py
      - name: Display BIST in TRY and Germany plus US in EUR
        run: python3 .ci/patch_v53_euro_display.py
      - name: Verify preserved technical set
        run: python3 .ci/verify_preserved_technical_set.py
      - name: Apply current version patches
        run: python3 .ci/patch_v41_version.py
      - name: Add separate exchange profiles
        run: python3 .ci/patch_v54_exchange_profiles.py
      - name: Add persistent short-term and three-strategy radar
        run: python3 .ci/patch_v55_profit_strategy.py
      - name: Add inspired dark trading UI
        run: python3 .ci/patch_v56_inspired_dark_ui.py
      - name: Fix dark UI navigation literals
        run: python3 .ci/patch_v57_fix_dark_nav.py
      - name: Add trading-style stock detail screen
        run: python3 .ci/patch_v57_trade_detail.py
      - name: Keep main radar persistent and manually refreshed
        run: python3 .ci/patch_v59_continuous_radar.py
      - name: Prioritize interactive stock detail analysis
        run: python3 .ci/patch_v60_detail_priority.py
      - name: Show fast technical detail before heavy analysis
        run: python3 .ci/patch_v62_fast_detail_preview.py
      - name: Retry failed radar symbols and show errors
        run: python3 .ci/patch_v63_scan_retry_errors.py
      - name: Tune parallel general and intraday scans
        run: python3 .ci/patch_v64_parallel_scan.py
      - name: Add dedicated hourly radar tab
        run: python3 .ci/patch_v65_hourly_tab.py
      - name: Gate strong hourly candidates with news KAP and social risk
        run: python3 .ci/patch_v66_hourly_gate_hook.py
      - name: Guard sell signals near support or without confirmation
        run: python3 .ci/patch_v68_decision_guard.py
      - name: Fix release build type
        run: python3 .ci/patch_v47_release_build.py
      - name: Restore stable signing key
        run: base64 -d .ci/borsaradar-final.keystore.b64 > .ci/borsaradar-final.keystore
      - name: Build signed release APK
        run: gradle --no-daemon clean assembleRelease
      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk BorsaRadar-v3.12.9.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BorsaRadar-v3.12.9-APK
          path: BorsaRadar-v3.12.9.apk
          if-no-files-found: error
          retention-days: 30
# build trigger: chart timeframe compile fix
