name: Build BorsaRadar 3.1 APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply v3.1 method and UI patch
        run: python3 .ci/patch_v31.py
      - name: Restore stable signing key
        run: base64 -d .ci/borsaradar-final.keystore.b64 > .ci/borsaradar-final.keystore
      - name: Build APK
        run: gradle --no-daemon clean assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BorsaRadar-v3.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BorsaRadar-v3.1-APK
          path: BorsaRadar-v3.1.apk
          if-no-files-found: error
          retention-days: 30
