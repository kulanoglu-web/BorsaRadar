name: Build BorsaRadar 3.10.4 APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Apply broker and alarm base patch
        run: python3 .ci/patch_v31.py
      - name: Apply lazy timeframe patch
        run: python3 .ci/patch_v37.py
      - name: Apply v3.8.1 V35 and notification tap patch
        run: python3 .ci/patch_v38.py
      - name: Enable Germany and US quote symbols
        run: python3 .ci/patch_v41_market.py
      - name: Add Germany and US direct entry UI
        run: python3 .ci/patch_v41_ui.py
      - name: Fix autocomplete dropdown
        run: python3 .ci/patch_v42_autocomplete_fix.py
      - name: Apply current version patches
        run: python3 .ci/patch_v41_version.py
      - name: Fix release build type
        run: python3 .ci/patch_v47_release_build.py
      - name: Restore stable signing key
        run: base64 -d .ci/borsaradar-final.keystore.b64 > .ci/borsaradar-final.keystore
      - name: Build signed release APK
        run: gradle --no-daemon clean assembleRelease
      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk BorsaRadar-v3.10.4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BorsaRadar-v3.10.4-APK
          path: BorsaRadar-v3.10.4.apk
          if-no-files-found: error
          retention-days: 30
