name: Android APK and Emulator Screenshot

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-screenshot:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - name: Boot Pixel 7 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_7
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            PKG=$(grep -o 'namespace[[:space:]]*[= ]*["'"'][^"'"']*' app/build.gradle* | head -1 | sed -E 's/.*["'"']([^"'"']+).*/\1/' || true)
            [ -n "$PKG" ] || PKG=com.kulanoglu.borsaradar
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
            sleep 8
            adb exec-out screencap -p > borsaradar-home.png
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BorsaRadar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload real emulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: BorsaRadar-real-screen
          path: borsaradar-home.png
